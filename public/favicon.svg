<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Blue rounded square background -->
  <rect width="100" height="100" rx="18" ry="18" fill="#1a56db"/>

  <!-- Mortarboard top (diamond) -->
  <polygon points="50,21 80,35 50,49 20,35" fill="white"/>

  <!-- Cap body -->
  <path d="M30,41 L30,60 Q30,73 50,73 Q70,73 70,60 L70,41 L50,49 Z" fill="white"/>

  <!-- Tassel cord -->
  <line x1="80" y1="35" x2="80" y2="62" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Tassel end -->
  <circle cx="80" cy="66" r="4" fill="white"/>
</svg>
