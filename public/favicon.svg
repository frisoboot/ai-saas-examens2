<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Blue rounded square background -->
  <rect width="100" height="100" rx="20" ry="20" fill="#1a56db"/>

  <!-- Graduation cap board (diamond/rhombus top) -->
  <polygon points="50,18 80,32 50,46 20,32" fill="white"/>

  <!-- Cap body -->
  <path d="M30,36 L30,57 C30,66 39,72 50,72 C61,72 70,66 70,57 L70,36 L50,46 Z" fill="white"/>

  <!-- Tassel cord -->
  <line x1="80" y1="32" x2="80" y2="58" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Tassel end -->
  <circle cx="80" cy="63" r="4.5" fill="white"/>
</svg>
